services:
  game-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: thelastsignal-server:local
    ports:
      - "7777:7777/udp"
    command:
      - "-port"
      - "7777"
      - "-bindAddress"
      - "0.0.0.0"
      - "-matchId"
      - "local-dev"
      - "-testToken"
      - "dev-token"
      - "-emptyTimeoutSeconds"
      - "3600"
    restart: "unless-stopped"
